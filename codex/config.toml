# Tracked base only. link.sh writes ~/.codex/config.toml as this file plus the machine
# state Codex adds itself ([projects.*] trust, [hooks.state], notices), which stays untracked.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "low"
[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "used-tokens", "five-hour-limit", "weekly-limit", "estimated-thread-cost"]
status_line_use_colors = true
theme = "dracula"

[features]
hooks = true

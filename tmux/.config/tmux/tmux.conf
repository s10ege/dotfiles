# ---------- Prefix: Ctrl+Space instead of Ctrl+b ----------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------- Basics ----------
set -g mouse on                  # click panes, drag borders, scroll
set -g base-index 1              # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10            # makes Esc fast in Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g status-position top
set -g focus-events on           # lets Neovim notice when you switch back (autoread)
set -g extended-keys on          # Shift+Enter etc. reach apps like Claude Code
set -as terminal-features 'xterm*:extkeys'

# ---------- Splits and windows open in the current folder ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C split-window -h -l 40% -c "#{pane_current_path}" claude   # prefix + C: Claude beside you

# prefix + Enter: open/close the floating Claude helper
bind Enter if-shell -F '#{==:#{session_name},help}' 'detach-client' 'run-shell ~/.config/tmux/claude-help.sh'

# ---------- Resize panes: prefix + H/J/K/L (hold to repeat) ----------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------- Reload this config: prefix + r ----------
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ---------- Vim-style copy mode ----------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------- Plugins ----------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ---------- Theme ----------
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'

[tools]
claude = "latest"
codex = "latest"
gh = "latest"
node = "26.8.2"
opencode = "latest"
"npm:ccusage" = "latest"
"pipx:hermes-agent" = { version = "latest", extras = "all" }
python = "latest"
uv = "latest"            # mise installs pipx: packages with uv
# Shared CLIs: upstream release binaries for linux-x64 and macos-x64
# (atuin uses github: because the aqua entry has no macos-x64 asset)
"aqua:neovim/neovim" = "latest"
"aqua:starship/starship" = "latest"
"github:atuinsh/atuin" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:casey/just" = "latest"
"aqua:gitleaks/gitleaks" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:sxyazi/yazi" = "latest"
"aqua:herdrdev/herdr" = { version = "latest", os = ["macos"] }  # Omarchy ships herdr via pacman; keep its client matching the running server
"github:kunchenguid/no-mistakes" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:junegunn/fzf" = "latest"
"npm:@xai-official/grok" = "latest"
pi = "latest"
"github:can1357/oh-my-pi" = "latest"
cursor-agent = { version = "latest", bin_path = "bin", strip_components = 0, url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(x64="x64", arm64="arm64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/', postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sfn ../dist-package/cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent"' }

[settings.upgrade]
auto_prune = false

[tools]
claude = "latest"
codex = "latest"
gh = "latest"
node = "26.8.2"
opencode = "latest"
"npm:ccusage" = "latest"
"pipx:hermes-agent" = { version = "latest", extras = "all" }
python = "latest"
# Shared CLIs: upstream release binaries for linux-x64 and macos-x64
# (atuin uses github: because the aqua entry has no macos-x64 asset)
"aqua:neovim/neovim" = "latest"
"aqua:starship/starship" = "latest"
"github:atuinsh/atuin" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:casey/just" = "latest"
"aqua:gitleaks/gitleaks" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:sharkdp/fd" = "latest"
"aqua:sxyazi/yazi" = "latest"
"aqua:herdrdev/herdr" = { version = "latest", os = ["macos"] }  # Omarchy ships herdr via pacman; keep its client matching the running server
"github:kunchenguid/no-mistakes" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"aqua:junegunn/fzf" = "latest"

[settings.upgrade]
auto_prune = false
